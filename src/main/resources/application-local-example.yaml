spring:
  mongodb:
    uri: "mongodb+srv://<username>:<password>@<cluster-url>/<database-name>?retryWrites=true&w=majority"
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: "<your-gmail-username>"
    password: "<your-16-digit-google-app-password>"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "<your-google-client-id>"
            client-secret: "<your-google-client-secret>"
            scope:
              - email
              - profile
jwt:
  secret: "<your-long-random-jwt-secret>"
  expiration: 1296000000 # 15 days

auth:
  mobile:
    test-bypass-enabled: true
    test-mobile-number: "1234567890"
    test-otp: "123456"

obligr:
  otp:
    base-url: "https://obligr.io"
    api-key: "<your-obligr-api-key>"
    sender-id: "<your-active-header-id>"
    message: "Your OTP Verification Code is : ##OTP##"
    dlt-template-id: "<optional-dlt-template-id>"
    dlt-pe-id: "<optional-dlt-pe-id>"
    email-id: "<your-obligr-account-email>"
    expire-time: 180
    otp-length: 6
